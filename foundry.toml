[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
# Read access so tests can load the committed proof vectors from test/fixtures.
fs_permissions = [{ access = "read", path = "./test/fixtures" }]
# SemaphoreVerifierKeyPts.sol is generated and large; silence the cosmetic warnings.
ignored_error_codes = [3860]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
